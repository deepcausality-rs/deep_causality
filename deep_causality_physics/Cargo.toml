[package]
name = "deep_causality_physics"
version = "0.10.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
authors = ["Marvin Hansen <marvin.hansen@gmail.com>"]
description = "Standard library of physics formulas and engineering primitives for DeepCausality."
documentation = "https://docs.rs/deep_causality"
categories = ["science", "simulation"]
keywords = ["physics", "causality", "simulation", "science"]
exclude = [
    "*.bazel",
    "*/*.bazel",
    "*.bazel.*",
    "BUILD",
    "BUILD.bazel",
    "MODULE.bazel",
    ".bazelignore",
    ".bazelrc",
    "papers/*",
]

[features]
default = ["std", "topology"]
std = [
    "alloc",
    "deep_causality_calculus/std",
    "deep_causality_core/std",
    "deep_causality_haft/std",
    "deep_causality_metric/std",
    "deep_causality_multivector/std",
    "deep_causality_num/std",
    "deep_causality_algebra/std",
    "deep_causality_stats/std",
    "deep_causality_num_complex/std",
    "deep_causality_num_dual/std",
    "deep_causality_linear/std",
    "deep_causality_tensor/std",
    "deep_causality_par/std",
]
alloc = []
no-std = [
    "alloc",
    "deep_causality_calculus/no-std",
    "deep_causality_core/no-std",
    "deep_causality_haft/no-std",
    "deep_causality_metric/no-std",
    "deep_causality_multivector/no-std",
    "deep_causality_num/no-std",
    "deep_causality_algebra/no-std",
    "deep_causality_stats/no-std",
    "deep_causality_num_complex/no-std",
    "deep_causality_num_dual/no-std",
    "deep_causality_linear/no-std",
    "deep_causality_tensor/no-std",
    "deep_causality_par/no-std",
]
# The gauge theories, the DEC kernels (EM, MHD, condensed matter, quantum,
# thermodynamics) and the fluid-dynamics differential forms, all of which are
# built on deep_causality_topology. The topology crate is std-only, so this
# feature enables `std`.
topology = ["std", "dep:deep_causality_topology"]
# Enables random number generator from the host OS for secure random numbers.
# Enabling os-random adds an indirect depdency on getrandom and libc.
# Disabled by default to use native Rust prng instead.
# Also enables Lund string fragmentation for QCD hadronization.
os-random = ["deep_causality_rand/os-random"] # required for lund hadronization
# Enables parallel execution of the DEC operator loops underneath the
# Navier-Stokes solver (wedge, interior product, de Rham, sharp) by
# forwarding to the topology crate's Rayon feature when `topology` is enabled.
# Disabled by default.
parallel = [
    "deep_causality_topology?/parallel",
    "deep_causality_par/parallel",
]

[dependencies.deep_causality_calculus]
workspace = true

[dependencies.deep_causality_core]
workspace = true

[dependencies.deep_causality_haft]
workspace = true

[dependencies.deep_causality_metric]
workspace = true

[dependencies.deep_causality_multivector]
workspace = true

[dependencies.deep_causality_num]
workspace = true

[dependencies.deep_causality_algebra]
workspace = true

[dependencies.deep_causality_stats]
workspace = true

[dependencies.deep_causality_num_complex]
workspace = true

[dependencies.deep_causality_num_dual]
workspace = true

[dependencies.deep_causality_rand]
workspace = true
optional = true

[dependencies.deep_causality_linear]
workspace = true

[dependencies.deep_causality_tensor]
workspace = true

[dependencies.deep_causality_topology]
workspace = true
optional = true

[dependencies.deep_causality_par]
workspace = true

[lints]
workspace = true
