[package]
name = "deep_causality_physics"
version = "0.8.2"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = "https://github.com/deepcausality/deep_causality.rs"
authors = ["Marvin Hansen <marvin.hansen@gmail.com>"]
description = "Standard library of physics formulas and engineering primitives for DeepCausality."
documentation = "https://docs.rs/deep_causality"
categories = ["science", "simulation"]
keywords = ["physics", "causality", "simulation", "science"]
exclude = [
    "*.bazel",
    "*/*.bazel",
    "*.bazel.*",
    "BUILD",
    "BUILD.bazel",
    "MODULE.bazel",
    ".bazelignore",
    ".bazelrc",
    "tests/**/*",
    "papers/*",
]

[features]
default = ["std"]
std = [
    "alloc",
    "deep_causality_core/std",
    "deep_causality_num/std",
    "deep_causality_algebra/std",
    "deep_causality_num_complex/std",
    "deep_causality_num_dual/std",
]
alloc = []
# Enables random number generator from the host OS for secure random numbers.
# Enabling os-random adds an indirect depdency on getrandom and libc.
# Disabled by default to use native Rust prng instead.
# Also enables Lund string fragmentation for QCD hadronization.
os-random = ["deep_causality_rand/os-random"] # required for lund hadronization
# Enables parallel execution of the DEC operator loops underneath the
# Navier-Stokes solver (wedge, interior product, de Rham, sharp) by
# forwarding to the topology crate's Rayon feature. Disabled by default.
parallel = [
    "deep_causality_topology/parallel",
    "deep_causality_par/parallel",
]

[dependencies.deep_causality_calculus]
workspace = true
features = ["default"]

[dependencies.deep_causality_core]
workspace = true
features = ["default"]

[dependencies.deep_causality_haft]
workspace = true
features = ["default"]

[dependencies.deep_causality_metric]
workspace = true
features = ["default"]

[dependencies.deep_causality_multivector]
workspace = true
features = ["default"]

[dependencies.deep_causality_num]
workspace = true
features = ["default"]

[dependencies.deep_causality_algebra]
workspace = true
features = ["default"]

[dependencies.deep_causality_num_complex]
workspace = true
features = ["default"]

[dependencies.deep_causality_num_dual]
workspace = true
features = ["default"]

[dependencies.deep_causality_rand]
workspace = true
optional = true

[dependencies.deep_causality_linear]
workspace = true

[dependencies.deep_causality_tensor]
workspace = true
features = ["default"]

[dependencies.deep_causality_topology]
workspace = true

[dependencies.deep_causality_par]
workspace = true
features = ["default"]

[lints]
workspace = true
