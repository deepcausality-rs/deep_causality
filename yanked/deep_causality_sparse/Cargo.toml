[package]
name = "deep_causality_sparse"
version = "0.2.6"
edition = "2024"
rust-version = "1.85"
license = "MIT"

repository = "https://github.com/deepcausality/deep_causality.rs"
authors = ["Marvin Hansen <marvin.hansen@gmail.com>"]
description = "RETIRED. Exports nothing. Use deep_causality_linear. See README."
documentation = "https://docs.rs/deep_causality_linear"
categories = ["data-structures", "science"]
keywords = ["deprecated", "sparse-matrix", "csr"]
readme = "README.md"

# Outside the repository workspace; published by hand with `cargo publish` from this directory.
[workspace]

# Kept empty so that a dependent naming any of them still resolves to this release.
[features]
default = ["std"]
std = ["alloc"]
alloc = []
no-std = ["alloc"]

[lints.rust]
unsafe_code = "forbid"
