[package]
name = "deep_causality_linear"
version = "0.1.2"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }

repository = "https://github.com/deepcausality/deep_causality.rs"
authors = ["Marvin Hansen <marvin.hansen@gmail.com>"]
description = "Linear algebra for the deep_causality crates: sparse, dense and bit-packed GF(2) matrices, vectors, and the algorithms over them."
documentation = "https://docs.rs/deep_causality_linear"
categories = ["mathematics", "science", "data-structures"]
keywords = ["linear-algebra", "matrix", "sparse-matrix", "gf2", "no-std"]
exclude = [
    "*.bazel",
    "*/*.bazel",
    "*.bazel.*",
    "BUILD",
    "BUILD.bazel",
    "MODULE.bazel",
    ".bazelignore",
    ".bazelrc",
    "tests/**/*",
    "papers/*",
]

[features]
default = ["std"]
std = ["alloc", "deep_causality_num/std", "deep_causality_algebra/std", "deep_causality_haft/std"]
alloc = []
no-std = ["alloc", "deep_causality_num/no-std", "deep_causality_algebra/no-std", "deep_causality_haft/no-std"]

[dependencies.deep_causality_num]
workspace = true

[dependencies.deep_causality_algebra]
workspace = true

[dependencies.deep_causality_haft]
workspace = true

[dev-dependencies.deep_causality_num_complex]
workspace = true
features = ["default"]

[dev-dependencies.deep_causality_num_rational]
workspace = true
features = ["default"]

[lints]
workspace = true
