[package]
name = "deep_causality_haft"
version = "0.4.3"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }

repository = "https://github.com/deepcausality/deep_causality.rs"
authors = ["Marvin Hansen <marvin.hansen@gmail.com>"]
description = "HKT traits for for the deep_causality crate."
documentation = "https://docs.rs/deep_causality"
categories = ["development-tools"]
keywords = ["HKT", "traits"]
# Exclude all bazel files as these conflict with Bazel workspace when vendored.
exclude = [
    "*.bazel",
    "*/*.bazel",
    "*.bazel.*",
    "BUILD",
    "BUILD.bazel",
    "MODULE.bazel",
    ".bazelignore",
    ".bazelrc",
    "tests/**/*",
    "papers/*",
]

[features]
default = ["std"]
std = ["alloc", "deep_causality_algebra/std"]
alloc = []
no-std = ["alloc", "deep_causality_algebra/no-std"]

[dependencies.deep_causality_algebra]
path = "../deep_causality_algebra"
version = "0.4"
default-features = false

[lints]
workspace = true
