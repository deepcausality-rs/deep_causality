[package]
name = "deep_causality_uncertain"
version = "0.5.5"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true}

authors = ["Marvin Hansen <marvin.hansen@gmail.com>", ]
description = "A First-Order Type for Uncertain Programming for the DeepCausality project.'"
documentation = "https://docs.rs/deep_causality"
exclude = [
    "*.bazel",
    "*/*.bazel",
    "*.bazel.*",
    "BUILD",
    "BUILD.bazel",
    "MODULE.bazel",
    ".bazelignore",
    ".bazelrc",
    "tests/**/*",
    "papers/*",
]

[features]
# Enables random number generator from the host OS for secure random numbers.
# Enabling os-random adds an indirect depdency on getrandom and libc.
# Disabled by default to use native Rust prng instead.
os-random = ["deep_causality_rand/os-random"]


[dependencies.deep_causality_stats]
workspace = true
features = ["std"]

[dependencies.deep_causality_rand]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies.deep_causality_ast]
workspace = true
features = ["default"]

[dependencies.deep_causality_num]
workspace = true
features = ["default"]

[dependencies.deep_causality_algebra]
workspace = true
features = ["default"]

[dependencies.deep_causality_haft]
workspace = true
features = ["default"]

[dev-dependencies]
criterion = { workspace = true }

# The two container crates are **dev**-dependencies
# here, where they reach the test harness and not the library.
deep_causality_linear = { workspace = true, features = ["default"] }
deep_causality_tensor = { workspace = true, features = ["default"] }

[[bench]]
name = "uncertain_benchmarks"
harness = false

[[bench]]
name = "maybe_uncertain_benchmarks"
harness = false

[lints]
workspace = true
