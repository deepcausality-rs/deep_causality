[package]
name = "deep_causality_multivector"
version = "0.6.2"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }

repository = "https://github.com/deepcausality/deep_causality.rs"
authors = ["Marvin Hansen <marvin.hansen@gmail.com>"]
description = "Multivector and MultiField implementation for DeepCausality"
documentation = "https://docs.rs/deep_causality"
categories = ["data-structures", "science", "mathematics"]
keywords = ["data-structures", "vector"]
# Exclude all bazel files as these conflict with Bazel workspace when vendored.
exclude = [
    "*.bazel",
    "*/*.bazel",
    "*.bazel.*",
    "BUILD",
    "BUILD.bazel",
    "MODULE.bazel",
    ".bazelignore",
    ".bazelrc",
    "tests/**/*",
    "papers/*",
]

[features]
default = ["std"]
std = ["alloc", "deep_causality_haft/std", "deep_causality_num/std", "deep_causality_algebra/std", "deep_causality_num_complex/std", "deep_causality_linear/std", "deep_causality_tensor/std", "deep_causality_metric/std"]
alloc = []
no-std = ["alloc", "deep_causality_haft/no-std", "deep_causality_num/no-std", "deep_causality_algebra/no-std", "deep_causality_num_complex/no-std", "deep_causality_linear/no-std", "deep_causality_tensor/no-std", "deep_causality_metric/no-std"]

[dependencies.deep_causality_haft]
workspace = true

[dependencies.deep_causality_num]
workspace = true

[dependencies.deep_causality_algebra]
workspace = true

[dependencies.deep_causality_num_complex]
workspace = true

[dependencies.deep_causality_linear]
workspace = true

[dependencies.deep_causality_tensor]
workspace = true

[dependencies.deep_causality_metric]
workspace = true

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "multivector_bench"
harness = false

[[bench]]
name = "multifield_bench"
harness = false


[lints]
workspace = true
