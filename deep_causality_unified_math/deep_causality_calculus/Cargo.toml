[package]
name = "deep_causality_calculus"
version = "0.2.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true}

authors = ["Marvin Hansen <marvin.hansen@gmail.com>"]
description = "Arrow-native differentiation and integration operators (the tangent functor over Dual, endomorphism iteration over endo-arrows, and quadrature) for the deep_causality project."
documentation = "https://docs.rs/deep_causality"
categories = ["development-tools", "mathematics"]
keywords = ["autodiff", "integration", "arrow", "calculus"]
# Exclude all bazel files as these conflict with Bazel workspace when vendored.
exclude = [
    "*.bazel",
    "*/*.bazel",
    "*.bazel.*",
    "BUILD",
    "BUILD.bazel",
    "MODULE.bazel",
    ".bazelignore",
    ".bazelrc",
    "papers/*",
]


[features]
# `no-std` builds on core alone: the operators allocate nothing, so no allocator is required.
# `alloc` is the allocator level only: it forwards to deep_causality_haft's heap witnesses, but it
# does not pick a float-math backend for deep_causality_num. Build with `std` or `no-std`; `alloc`
# on its own is rejected at the guard in deep_causality_num.
default = ["std"]
std = ["alloc", "deep_causality_haft/std", "deep_causality_num/std", "deep_causality_algebra/std", "deep_causality_num_dual/std"]
alloc = ["deep_causality_haft/alloc"]
no-std = ["deep_causality_haft/no-std", "deep_causality_num/no-std", "deep_causality_algebra/no-std", "deep_causality_num_dual/no-std"]


[dependencies.deep_causality_haft]
workspace = true

[dependencies.deep_causality_num]
workspace = true

[dependencies.deep_causality_algebra]
workspace = true

[dependencies.deep_causality_num_dual]
workspace = true

[lints]
workspace = true
