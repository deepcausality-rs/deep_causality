[package]
name = "deep_causality_homology"
version = "0.1.2"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }

repository = "https://github.com/deepcausality/deep_causality.rs"
authors = ["Marvin Hansen <marvin.hansen@gmail.com>", ]
description = "Chain complexes, boundary operators and homology over a chosen coefficient field, independent of any geometry."
documentation = "https://docs.rs/deep_causality_homology"
categories = ["development-tools", "mathematics"]
keywords = ["homology", "chain-complex", "betti", "topology"]
# Exclude all bazel files as these conflict with Bazel workspace when vendored.
exclude = [
    "*.bazel",
    "*/*.bazel",
    "*.bazel.*",
    "BUILD",
    "BUILD.bazel",
    "MODULE.bazel",
    ".bazelignore",
    ".bazelrc",
    "tests/*",
    "tests/**/*",
    "papers/*",
]

[features]
default = ["std"]
std = ["alloc", "deep_causality_num/std", "deep_causality_linear/std"]
alloc = []
no-std = ["alloc", "deep_causality_num/no-std", "deep_causality_linear/no-std"]

[dependencies.deep_causality_num]
workspace = true

[dependencies.deep_causality_linear]
workspace = true

[lints]
workspace = true
