[package]
name = "deep_causality_metric"
version = "0.2.7"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true}

authors = ["Marvin Hansen <marvin.hansen@gmail.com>"]
description = "Metric signature types and sign conventions for Clifford algebras and physics"
documentation = "https://docs.rs/deep_causality_metric"
categories = ["mathematics", "science"]
keywords = ["metric", "clifford", "spacetime", "signature", "physics"]
# Exclude all bazel files as these conflict with Bazel workspace when vendored.
exclude = [
    "*.bazel",
    "*/*.bazel",
    "*.bazel.*",
    "BUILD",
    "BUILD.bazel",
    "MODULE.bazel",
    ".bazelignore",
    ".bazelrc",
    "tests/**/*",
    "papers/*",
]

[features]
default = ["std"]
std = ["alloc"]
alloc = []
no-std = ["alloc"]

# This crate has ZERO external dependencies
# It is a foundational crate

[lints]
workspace = true
