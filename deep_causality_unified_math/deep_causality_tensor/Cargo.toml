[package]
name = "deep_causality_tensor"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

repository = "https://github.com/deepcausality/deep_causality.rs"
authors = ["Marvin Hansen <marvin.hansen@gmail.com>"]
description = "Tensor data structure for for deep_causality crate."
documentation = "https://docs.rs/deep_causality"
categories = ["data-structures", "science"]
keywords = ["data-structures", "tensor"]
# Exclude all bazel files as these conflict with Bazel workspace when vendored.
exclude = [
    "*.bazel",
    "*/*.bazel",
    "*.bazel.*",
    "BUILD",
    "BUILD.bazel",
    "MODULE.bazel",
    ".bazelignore",
    ".bazelrc",
    "tests/**/*",
    "papers/*",
]

[features]
default = ["std"]
std = ["alloc", "deep_causality_ast/std", "deep_causality_haft/std", "deep_causality_num/std", "deep_causality_algebra/std", "deep_causality_num_complex/std", "deep_causality_num_dual/std", "deep_causality_linear/std"]
alloc = []
no-std = ["alloc", "deep_causality_ast/no-std", "deep_causality_haft/no-std", "deep_causality_num/no-std", "deep_causality_algebra/no-std", "deep_causality_num_complex/no-std", "deep_causality_num_dual/no-std", "deep_causality_linear/no-std"]

[dependencies.deep_causality_ast]
workspace = true

[dependencies.deep_causality_haft]
workspace = true

[dependencies.deep_causality_num]
workspace = true

[dependencies.deep_causality_algebra]
workspace = true

[dependencies.deep_causality_num_complex]
workspace = true

[dependencies.deep_causality_num_dual]
workspace = true

[dependencies.deep_causality_linear]
workspace = true

[dev-dependencies]
criterion = { workspace = true }
deep_causality_rand = { workspace = true }

[[bench]]
name = "bench_causal_tensor"
harness = false

[lints]
workspace = true
