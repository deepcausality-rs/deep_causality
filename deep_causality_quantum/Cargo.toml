[package]
name = "deep_causality_quantum"
version = "0.2.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = "https://github.com/deepcausality/deep_causality.rs"
authors = ["Marvin Hansen <marvin.hansen@gmail.com>"]
description = "Quantum causal models on the causal monad: quantum-information kernels, gates, and the operator layer for DeepCausality."
documentation = "https://docs.rs/deep_causality"
categories = ["science", "simulation"]
keywords = ["quantum", "causality", "simulation", "science"]
exclude = [
    "*.bazel",
    "*/*.bazel",
    "*.bazel.*",
    "BUILD",
    "BUILD.bazel",
    "MODULE.bazel",
    ".bazelignore",
    ".bazelrc",
    "tests/**/*",
    "papers/*",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std", "qcm"]
std = ["alloc", "deep_causality_algebra/std", "deep_causality_core/std", "deep_causality_haft/std", "deep_causality_homology/std", "deep_causality_linear/std", "deep_causality_metric/std", "deep_causality_multivector/std", "deep_causality_num/std", "deep_causality_num_complex/std", "deep_causality_num_rational/std", "deep_causality_tensor/std"]
alloc = []
no-std = ["alloc", "deep_causality_algebra/no-std", "deep_causality_core/no-std", "deep_causality_haft/no-std", "deep_causality_homology/no-std", "deep_causality_linear/no-std", "deep_causality_metric/no-std", "deep_causality_multivector/no-std", "deep_causality_num/no-std", "deep_causality_num_complex/no-std", "deep_causality_num_rational/no-std", "deep_causality_tensor/no-std"]

# The quantum causal-model slice: CausalStructure, the Markov freeze check and the
# C3-exclusion faithfulness check. Pulls in `deep_causality` for the causal graph,
# which is std-only, so `qcm` implies `std` and is off on bare-metal builds.
qcm = ["std", "dep:deep_causality"]
# The emergent QPU seam: QpuSampler / ShotHistogram / the shots→Uncertain
# bridges / qpu_effect / the in-process SimQpu. Off by default; adds no
# network or async dependency.
qpu = ["dep:deep_causality_uncertain"]

[dependencies.deep_causality]
workspace = true
optional = true

[dependencies.deep_causality_algebra]
workspace = true

[dependencies.deep_causality_core]
workspace = true

[dependencies.deep_causality_homology]
workspace = true

[dependencies.deep_causality_haft]
workspace = true

[dependencies.deep_causality_linear]
workspace = true

[dependencies.deep_causality_metric]
workspace = true

[dependencies.deep_causality_multivector]
workspace = true

[dependencies.deep_causality_num]
workspace = true

[dependencies.deep_causality_num_rational]
workspace = true

[dependencies.deep_causality_num_complex]
workspace = true

[dependencies.deep_causality_tensor]
workspace = true

[dependencies.deep_causality_uncertain]
workspace = true
optional = true

[lints]
workspace = true
