[package]
name = "deep_causality"
version = "0.15.2"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
readme = "../README.md"

description = "Computational causality library. Provides causality graph, collections, context and causal reasoning."
documentation = "https://docs.rs/deep_causality"
homepage = "https://deepcausality.com/about/"
repository = "https://github.com/deepcausality/deep_causality.rs"
keywords = ["causality", "causal-graph", "causal-reasoning", "graph"]
authors = ["Marvin Hansen <marvin.hansen@gmail.com>"]
categories = [
    "data-structures",
    "science",
    "aerospace",
    "mathematics",
]
exclude = [
    "*.bazel",
    "*/*.bazel",
    "*.bazel.*",
    "BUILD",
    "BUILD.bazel",
    "MODULE.bazel",
    ".bazelignore",
    ".bazelrc",
    "tests/**/*",
    "papers/*",
]


[features]
# Enables random number generator from the host OS for secure random numbers.
# Enabling os-random adds an indirect depdency on getrandom and libc.
# Disabled by default to use native Rust rng instead.
os-random = ["deep_causality_uncertain/os-random"]

[dependencies.deep_causality_algebra]
workspace = true
features = ["default"]

[dependencies.deep_causality_uncertain]
workspace = true

[dependencies.deep_causality_ast]
workspace = true
features = ["default"]

[dependencies.deep_causality_core]
workspace = true
features = ["default"]

[dependencies.deep_causality_data_structures]
workspace = true

[dependencies.deep_causality_haft]
workspace = true
features = ["default"]

[dependencies.ultragraph]
workspace = true

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "bench_main"
harness = false

[lints]
workspace = true
