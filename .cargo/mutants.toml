#
# cargo-mutants configuration.
#
# ---------------------------------------------------------------------------------------------
# Why this exists
# ---------------------------------------------------------------------------------------------
#
# Line coverage answers "did this run". It does not answer "would a test notice if this were
# wrong", and the two came apart badly in `deep_causality_topology`: the topological-charge
# normalization was eight times too small, its line ran 513 times across the suite, and every
# charge test used the identity gauge field, where the field strength is zero and any constant
# gives the same answer. A true assertion with no discriminating power.
#
# Mutation testing asks the second question directly. A surviving mutant is a change to the
# source that no test objects to.
#
# ---------------------------------------------------------------------------------------------
# Writing an exclusion
# ---------------------------------------------------------------------------------------------
#
# Each entry is a REGULAR EXPRESSION matched against the mutant's description, and mutant
# descriptions are full of regex metacharacters. `+` and `*` are the ones that bite: written bare,
# `replace + with * in sym_eig` compiles to "replace", one-or-more spaces, "with", zero-or-more
# spaces, "in sym_eig", which no mutant says. cargo-mutants reports nothing, because that is a
# valid regex and it matched nothing. `|` bites the other way: bare `||` is an alternation between
# two empty branches, which matches every mutant and empties the whole run. Both failures were
# present in this file. Two entries were inert, excluding 7 mutants where 44 were intended, and a
# third excluded all 2300.
#
# Escape `+`, `*`, `|`, `(`, `)`, `[`, `]`, `?`, `.` and `^` as `\\+`, `\\*` and so on. After
# adding one, check that it matched:
#
#     printf 'exclude_re = []\n' > /tmp/none.toml
#     cargo mutants --list -p <crate> --config /tmp/none.toml | sort > /tmp/all.txt
#     cargo mutants --list -p <crate> --config .cargo/mutants.toml | sort > /tmp/kept.txt
#     comm -23 /tmp/all.txt /tmp/kept.txt
#
# The last command prints exactly what the file excludes. An entry that appears in no line of it is
# not doing anything, and an entry that pulls in more than it argues for is hiding caught mutants.

# ---------------------------------------------------------------------------------------------
# Equivalent mutants
# ---------------------------------------------------------------------------------------------
#
# A mutant that cannot change behaviour is not a test gap and no test can kill it. Those are
# excluded by name below, each with the argument for why it is equivalent. A survivor that is
# neither listed here nor in the section further down for the ones no regex can reach alone is a
# real gap.

exclude_re = [
    # `if x < lo { lo = x }` and `if x > hi { hi = x }` versus `<=` / `>=` in the min and max scan
    # of `bin_equal_width`, and `if q > last { last } else { q }` in its clamp. All three write a
    # VALUE and never an index, so on a tie the branch a mutant takes stores the number the other
    # branch would have stored. Same argument as the norm reductions above.
    "replace < with <= in bin_equal_width",
    "replace > with >= in bin_equal_width",

    # `if x > acc { x } else { acc }` versus `>=` in a maximum reduction, and the two-argument
    # `if a > b { (a, b) } else { (b, a) }` that orders a pair. On a tie the two branches do
    # different things and produce the same VALUE, because what is written is the maximum itself
    # and never its index: the value a tie overwrites equals the one it replaces. Applies to
    # `log_sum_exp`'s max scan and `log_add_exp`'s ordering. Same argument as `vector_norm_inf`
    # above. `fit_logistic`'s largest-step reduction is the same shape and is NOT excluded here,
    # for the reason recorded in the section below.
    "replace > with >= in log_sum_exp",
    "replace > with >= in log_add_exp",

    # `sort_desc_3`'s three-comparison network, `if a[k] < a[k+1] { swap }` versus `<=`. On a tie
    # the `<=` branch swaps two equal values, which is not observable: the array is of values and
    # carries no index. `NaN` does not separate them either — both `NaN < x` and `NaN <= x` are
    # false, so the two forms take the same branch there too.
    "replace < with <= in sort_desc_3",

    # `eigen_symmetric_3x3`'s `acos` clamp, `if r < -1 { r = -1 }` and `if r > 1 { r = 1 }` versus
    # `<=` / `>=`. At exactly `±1` the assignment writes the value the variable already holds.
    "replace < with <= in eigen_symmetric_3x3",
    "replace > with >= in eigen_symmetric_3x3",

    # `Complex`'s scaled modulus orders its two components with `if a > b { (a, b) } else { (b, a) }`
    # before dividing the smaller by the larger. Same argument: on a tie the two branches select
    # different *branches* and produce the same *pair*, since `a == b` makes `(a, b)` and `(b, a)`
    # the same value. The ratio, and therefore the modulus, is identical either way.
    "replace > with >= in <impl Normed for Complex<T>>::modulus",

    # `max_modulus`'s reduction, `if m > acc { m } else { acc }`. Same argument as `log_sum_exp`'s
    # max scan above: what is written is the maximum itself and never its index, so on a tie the
    # value the mutant selects equals the one it replaces.
    "replace > with >= in max_modulus",

    # Two `solve_kepler` entries used to sit here for the mean-anomaly wrap. **Both are removed, and
    # the equivalence argument behind them no longer holds.** It read: mutating the wrap's `-` to `+`
    # or its `/` to `*` changes only which whole multiple of 2π is removed, and `M → M ± 2πk` sends
    # the root `E → E ± 2πk`, so a position depending on `E` only through `sin` and `cos` cannot tell
    # the difference.
    #
    # Two things were wrong with that. The narrower one: neither pattern is confined to the wrap.
    # `replace - with \\+ in ...solve_kepler` matches **six** mutants — the wrap at `183:19`, and
    # Newton's residual `ea − e·sin ea − m` and its update at `196` and `211`, which are the
    # iteration's actual arithmetic and were never argued for. `replace / with \\* ...` matches two,
    # the wrap's division and Newton's `f / f'`.
    #
    # The wider one: **all eight are caught today.** Measured, after the suite gained the `f32`
    # convergence cases — `cargo mutants -p deep_causality_physics -F` on both patterns reports
    # `8 mutants tested: 8 caught`. Whatever was true of the old suite, no mutant here is equivalent
    # against the present one, and excluding them would hide eight working tripwires.

    # Tolerance comparisons `if x.abs() < tol` mutated to `<=`: the tie is the single point
    # `x.abs() == tol`, which no finite input reaches against a residual that is either many orders
    # below the tolerance or many above. Applies to `solve_kepler`'s step and residual tests, whose
    # tolerance is `8·R::epsilon()` — scaled, not the fixed `1e-15` it once was, so that an `f32`
    # iterate can reach it at all. `solve_w_mass`'s convergence test is the same shape and is NOT excluded here,
    # for the reason recorded in the section below.
    "replace < with <= in TwoBodyPropagator<R>::solve_kepler",

    # `CsrMatrix::zero()` versus `Default::default()`. `Zero::zero` returns `CsrMatrix::new()`,
    # and `Default::default()` builds the same struct field for field -- three empty vectors and
    # the shape `(0, 0)`. The two are the same value, so no test can separate them.
    "replace <impl Zero for CsrMatrix<T>>::zero -> Self with Default::default",

    # `EntropyConfig::bits()` versus `Default::default()`. The default IS bits, SkipZero and
    # Normalisation::None — stated on the type and asserted in `entropy_config_tests` — so the
    # constructor and the derive return the same value by construction. No test can separate them,
    # and one that could would be asserting that the documented default is not the default.
    "replace EntropyConfig<T>::bits -> Self with Default::default\\(\\)",

    # `if m > best { best = m }` versus `>=` in a maximum reduction. On a tie the two do different
    # things: `>` keeps the incumbent, `>=` overwrites it. They are the same function anyway,
    # because these three return the maximum VALUE and never its index, and the value a tie writes
    # is equal to the one it replaces. Applies to `vector_norm_inf`, `matrix_norm_l1` and
    # `matrix_norm_inf`; `negligible_below` below is the same argument.
    "replace > with >= in vector_norm_inf",
    "replace > with >= in matrix_norm_l1",
    "replace > with >= in matrix_norm_inf",

    # `if rows == 0 || cols == 0` versus `&&` in `HomologyField::rank_of`. The guard is an early
    # exit, not a correctness gate: measured on `(0,5)`, `(5,0)`, `(0,0)`, `(0,100)` and `(100,0)`,
    # both eliminations return `Ok(0)` when they are allowed to run, so the mutant reaches the same
    # answer by the longer route. Nothing is saved by the early exit either, since the widening
    # allocates `rows * cols == 0` elements in every one of those shapes.
    #
    # This path is hot after `extract-homology-crate`: the degenerate grades now return `(0, n_0)`
    # and `(n_max, 0)` rather than an empty matrix, so every `betti_number_over` call reaches it
    # twice.
    "replace \\|\\| with && in HomologyField::rank_of",

    # `if rows == 0 || cols == 0` versus `&&` in `svd_sorted`. The two differ only when exactly
    # one dimension is zero, and there the general path produces the same factors as the early
    # return: for `3 x 0` both give `U` at `3 x 0` and `Vᴴ` at `0 x 0`, for `0 x 4` both give `U`
    # at `0 x 0` and `Vᴴ` at `0 x 4`, with no singular values either way. Checked by applying the
    # mutant and diffing the printed factors for both orientations: identical.
    #
    # `let transposed = rows < cols` versus `<=` in `svd_sorted`. Widening it sends a square
    # matrix down the transposed path, which is the same computation: from `A = U Σ Vᴴ` it
    # follows that `Aᴴ = V Σ Uᴴ`, so decomposing `Aᴴ` yields `U' = V` and `V' = U`, and the
    # function's own swap-back returns `U` and `Vᴴ` unchanged. Checked by applying the mutant to
    # `[[4, 1], [2, 3]]`, a matrix whose two factors are different (`A Aᴴ = [[17,11],[11,13]]`
    # against `Aᴴ A = [[20,10],[10,10]]`): every entry of `U` and `Vᴴ` agrees to fifteen digits,
    # differing only in the last one or two units in the last place.
    #
    # `test_a_square_matrix_keeps_its_left_and_right_factors_distinct` was written to kill this
    # and cannot. It is kept because it pins `U` and `Vᴴ` as separate factors, which no test did
    # before, and because a reconstruction check cannot make that distinction.
    "replace \\|\\| with && in svd_sorted",
    "replace < with <= in svd_sorted",

    # Deleting the order-1 or order-3 closed-form arm of `determinant`. Those arms exist for speed
    # — the doc says so — and deleting one falls through to the pivoted elimination below, which
    # computes the same determinant. `test_the_three_by_three_closed_form_agrees_with_elimination`
    # asserts that agreement directly, so the equivalence is pinned rather than assumed.
    #
    # The arithmetic INSIDE the arm is not equivalent and is not excluded:
    # `test_the_three_by_three_determinant_on_a_dense_matrix` kills those.
    "delete match arm 1 in determinant",
    "delete match arm 3 in determinant",

    # `if mag > scale` versus `>=` in `negligible_below`'s maximum reduction. The same argument as
    # the three norms above: the function returns the maximum value, not the index it came from.
    "replace > with >= in negligible_below",

    # `n_real += one` versus `-=` in `negligible_below`. The loop runs `n` times either way, so the
    # mutant leaves `n_real = -n` instead of `n`, and `rel = eps * n_real` changes sign. The return
    # is `scale * rel * rel`, where the sign cancels. The same number, by construction.
    "replace \\+= with -= in negligible_below",

    # `if rows == 0 || cols == 0` versus `&&` in `rank_exact`, which differ only when exactly one
    # dimension is zero. Both paths then reach zero anyway: with `cols == 0` the content loop never
    # runs and `for col in 0..0` never runs, and with `rows == 0` the first `if row >= rows` breaks
    # immediately. `test_exact_rank_of_rectangular_and_empty_shapes` pins the value for all three
    # empty shapes rather than leaving the claim on this comment.
    "replace \\|\\| with && in rank_exact",

    # `for j in (i + 1)..n` versus `(i * 1)..n` in `solve_upper`'s backward substitution, which is
    # the `solve_least_squares` argument above in another function: the extra index is `j = i`, and
    # the term it adds is `a[i][i] * x[i]` where `x[i]` is still zero, because it is assigned on the
    # line after the sum.
    "replace \\+ with \\* in solve_upper",
]

# ---------------------------------------------------------------------------------------------
# Equivalent, and not excludable without hiding caught mutants
# ---------------------------------------------------------------------------------------------
#
# These are equivalent for the reasons below, and each is left in the report because no regex
# reaches it alone. `exclude_re` matches the mutant's description, not its line, and every pattern
# broad enough to catch one of these also catches a neighbour that is not equivalent — one the
# suite kills, or one it does not kill and should. Hiding either costs a tripwire, which is worth
# more than a tidy report.
#
# `small.rs:326:35: replace + with - in eigen_symmetric_3x3` — the second root is taken at
# `phi + 2π/3` and the third recovered from the trace. The three roots of the characteristic cubic
# sit at `phi`, `phi + 2π/3` and `phi − 2π/3`, so the mutant computes a different *member* of the
# same three and the trace recovers whichever one is left over; the returned array is sorted, so
# the output is identical. Confirmed rather than argued: the mutant passes the 200-matrix agreement
# against cyclic Jacobi and all three characteristic invariants, which is what it would break if the
# root set had moved. Left in the report because `replace \+ with - in eigen_symmetric_3x3` matches
# thirteen mutants in that function and the suite kills the other twelve.
#
# `logistic.rs:165:18: replace > with >= in fit_logistic` — the Newton loop's largest-step scan,
# `if m > largest { largest = m }`. The same argument as `log_sum_exp`'s max scan above: what is
# written is the step magnitude itself and never its index, so on a tie the value the mutant
# selects equals the one it replaces. Confirmed by running it; it survives.
#
# It is left in the report because `replace > with >= in fit_logistic` also names
# `logistic.rs:78:45`, the label validation `v < T::zero() || v > one`, where `>=` refuses the
# valid boundary label `y == 1` — a probability, and the label every fit in the suite uses. That
# one is CAUGHT. The two mutants have the same description, so no regex takes the reduction
# without taking the validation's tripwire with it, and the tripwire is worth more.
#
# `radiative.rs:150:32: replace < with <= in solve_w_mass` — the fixed point's convergence test,
# `(mw_new - mw).abs() < target_accuracy`. The tie is the single point `1e-6`, the same argument
# as `solve_kepler`'s tolerance comparisons above.
#
# It is left in the report because the same description also names `radiative.rs:140:25`, the
# quadratic's discriminant guard `if discriminant < 0`, and that one is NOT equivalent: at
# `discriminant == 0` the quadratic has the double root `M_W² = M_Z²/2`, which the mutant refuses
# as `NumericalInstability` rather than returning it. Both survive today, so the guard's boundary
# is an open gap: closing it needs an input that lands the discriminant on zero, which is a test to
# write and not a regex to add. Excluding it under the tolerance argument would have buried that.
#
# `read_sp3.rs:67:23: replace < with ==` and `replace < with <=` in `parse_orbit_data` — the SP3
# loop's `if line.len() < 2 { continue; }`. The guard is a cheap early-out over a file whose blank
# lines outnumber its records, not a correctness gate: every line it lets through on the mutant is
# rejected again a few lines later. At length 0 neither `starts_with('*')` nor `starts_with('P')`
# matches; at length 1, `"*"` reaches `parts.len() < 7` and `"P"` reaches `parts.len() < 2`; at
# length 2, `"P "` and `"*a"` do the same, and `"PE"` takes the compact branch, where
# `&parts[0][1..]` is `"E"` and fails the satellite comparison. The `else` branch cannot slice out
# of bounds either, since it is only reached when `parts[0]` starts with `'P'` and is not `"P"`,
# so it is at least two bytes.
#
# `read_sp3.rs:113:36: replace < with <=` — the position branch's `if parts.len() < 2`. The two
# differ only at `parts.len() == 2` (`"P E14"`), where the original proceeds with
# `coord_start_index = 2` and is stopped four lines on by `parts.len() < coord_start_index + 3`.
# Skipped either way, nothing pushed.
#
# Measured rather than argued: `test_short_and_degenerate_lines_are_ignored` feeds every one of
# those shapes — empty, `"*"`, `"P"`, `"P "`, `"PE"`, `"*a"`, and three truncated `P E14` records —
# around two complete ones, and all three mutants still pass the suite with it in place.
#
# They are left in the report because no regex reaches them alone.
# `replace < with <= in parse_orbit_data` also names `74:28` and `123:36`, and
# `replace < with == in parse_orbit_data` also names `74:28`, `113:36` and `123:36`. Those are the
# guards that do gate correctness — the epoch field count and the coordinate field count — and the
# suite kills every one of them. Excluding three equivalent mutants would cost between two and
# three working tripwires.
#
# `scoped_map.rs:56:20: replace <= with > in scoped_map` — reported MISSED by
# `scripts/mutants.sh deep_causality_par` and CAUGHT by the same run with `--features parallel`.
# It is a gap in neither. `cargo mutants` parses the source without evaluating `cfg`, and line 56
# is the `if threads <= 1` early-out inside the crate's `#[cfg(feature = "parallel")]` arm. The
# default-feature build never compiles that line, so mutating its text changes nothing and the
# suite passes; the parallel build does compile it, and
# `the_work_is_partitioned_into_one_chunk_per_core` fails on it, because inverting the guard
# returns the inline map and collapses 4099 elements onto a single thread.
#
# It is left in the report because a mutant's description carries no configuration, so the
# exclusion would take the parallel run's kill with it. The measurement is the pair of runs: the
# crate has three mutants, and none survives a build that actually compiles it.
#
# Note that the script runs the default features. Mutation-testing the parallel arm needs
# `cargo mutants -p deep_causality_par --features parallel`.

# Two entries used to be in the array above and were exactly that mistake.
# `replace \+ with \* in solve_least_squares` argued for one loop bound and excluded nine mutants,
# eight of them the index arithmetic `k * n + i`, `i * n + j` and `lf[i * n + i]`, which change the
# answer. `replace \+ with \* in sym_eig` argued for the rotation angle and excluded twenty-eight,
# including the index arithmetic of the similarity transform at lines 128-150 -- which the comment
# beside it explicitly said it did NOT cover. The prose and the pattern disagreed, and the pattern
# won silently. Both are now here instead.
#
#   cholesky.rs:168  replace + with * in solve_least_squares
#     `for j in (i + 1)..n` becomes `(i * 1)..n` in the back substitution. The extra index is
#     `j = i`, and the term it adds is `conj(L[i][i]) * x[i]`, where `x[i]` is still zero because
#     it is assigned on the line after the sum. A multiplication by zero at every `i` and every
#     `n`. The other eight `+ -> *` mutants in that function are index arithmetic and are killed.
#
#   kernels.rs       replace + with * in sym_eig, ANGLE ONLY (lines 65, 68, 75, 89, 90, 104, 105,
#                    111)
#     `t` sets only which angle the sweep turns through. `c = 1/sqrt(t*t + 1)` with `s = t*c` gives
#     `c^2 + s^2 = 1` for any `t`, so the rotation stays orthogonal, the similarity preserves the
#     spectrum exactly, and the sweep runs until the off-diagonal is under threshold. A mutated
#     angle changes the convergence rate, not the result. Checked rather than argued: with
#     `(zeta*zeta + one)` mutated to `(zeta*zeta * one)` -- which turns
#     `t = sgn/(|z| + sqrt(z^2+1))` into `sgn/(2|z|)` -- a 5x5 with a degenerate diagonal, a 4x4
#     with an exactly equal diagonal, and a 6x6 spanning 1e-3 to 1e3 all reconstruct to 1e-12 or
#     better.
#
#     The same argument covers every path-only mutation in `sym_eig`, not just the angle: Jacobi is
#     a fixed-point iteration under orthogonal similarity, so only the exit test or a break in the
#     similarity structure can change the answer. What it does NOT cover is the surrounding index
#     arithmetic. `a[p * n + p]`, `a[q * n + q]` and `(app - aqq)` are not angle choices, and
#     mutating them reconstructs to 1.4e-5, 3.1 and 3.1 respectively on a 5x5, caught by
#     `test_the_eigendecomposition_of_a_five_by_five_satisfies_its_defining_properties`.
#
#   integer.rs:79   replace - with / in determinant_exact
#     `for k in 0..(n - 1)` becomes `0..(n / 1)`, one extra iteration at `k = n - 1`. Both inner
#     loops there are empty, `prev` is written and never read again, and the pivot search reduces
#     to `((n)..n).find(..)`, which is `None` and returns zero -- the right answer, because the
#     branch is only reached when the last diagonal entry is zero.
#
#   integer.rs:82   replace + with * in determinant_exact
#     `((k + 1)..n).find(..)` becomes `(k..n).find(..)`. The extra candidate is `r = k`, and the
#     branch is only entered when `a[k][k]` is zero, so `find` steps past it to the same row.
#
#   solve.rs:74     replace + with * in Lu<T>::factor
#     `for r in (col + 1)..n` becomes `col..n`. The extra iteration compares `a[col][col]` against
#     `best_mag`, which was just seeded from that same entry, so `mag > best_mag` is false.
#
#   solve.rs:132    replace + with * in Lu<T>::apply
#     `.skip(i + 1)` becomes `.skip(i)` in the backward substitution, the same shape as the
#     `solve_upper` entry above: the extra term multiplies `x[i]`, still zero at that point.

# ---------------------------------------------------------------------------------------------
# The two noise floors, resolved
# ---------------------------------------------------------------------------------------------
#
# `householder_qr` and `jacobi_svd` each compute a floor from the input's magnitude and skip a
# column below it. Both floors carried surviving mutants for a long stretch, recorded here as
# unresolved, on the strength of probes at `1e-170` and `1e-280` that showed no difference.
#
# Those magnitudes were the mistake. A squared norm at `1e-170` is `1e-340`, which underflows to
# exactly zero, and the later `v_norm_sq <= 0` guard catches zero on its own. The window where the
# floor is the only thing standing between the input and an overflow is narrow: the squared norm
# has to be denormal and non-zero, which puts the entries near `1e-160`. There
# `v^H v` is about `7e-320`, `beta = 2/(v^H v)` is `3e319` and overflows to infinity, and every
# entry the reflector touches comes back non-finite.
#
# `test_a_sub_column_with_a_denormal_squared_norm_is_skipped_rather_than_reflected` supplies that
# input and kills both mutants of the Frobenius accumulation.
#
# The floor's own arithmetic needed a second input, at the other end. `||A||^2_F * eps * eps` has
# two factors of `eps` because the quantity compared against it is squared; dropping to one raises
# the floor by `1e16`. Nothing noticed, because every sub-column in the suite was either close to
# the largest entry or exactly zero.
# `test_a_small_but_genuine_sub_column_is_not_swallowed_by_the_qr_noise_floor` puts a sub-column at
# `1e-9`, above the true floor and below the inflated one.
#
# One thing about `householder_qr` had to be understood before either test could work. R's
# strictly-lower triangle is cleaned to exact zero on the way out, unconditionally, so no assertion
# below the diagonal can detect a reflector that did not run. The first versions of both tests
# asserted exactly that and could not fail. The reconstruction is the observable: zeroing an entry
# that no reflector eliminated discards it, and `Q*R` leaves `A` by the size of what was thrown
# away.
#
# `jacobi_svd`'s floor is a different case and is NOT resolved as a defect-preventing guard.
# Measured across column magnitudes from `1e-100` to `1e-200` on `[[1, m, 0], [0, m, 0],
# [0, 0, 1]]`, whose exact singular values are `{1, 1, m}`: with the floor in place the third value
# comes back as `m * sqrt(2)`, the raw norm of the skipped column, and with the floor removed it
# comes back as `m`, the singular value. The floor is making the answer worse, by 41% on a value
# that is `1e-100` times the largest and that the caller's rank gate discards either way.
#
# So the surviving mutants there are not a test gap. They mark a guard whose only effect is on
# numbers already below the problem's noise floor, and the question it raises is whether the guard
# should be there at all -- which is a change to the algorithm, not to the tests, and is left for
# its own decision rather than made here.
