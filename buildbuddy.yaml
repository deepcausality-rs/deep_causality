actions:
  - name: "BazelCI"
    triggers:
      pr:
        branches:
          - "main"
    steps:
      # Build all targets
      - run: "bazel build --config=ci //... --build_metadata=COMMIT_SHA=$(git rev-parse HEAD)"
      # Run all tests
      - run: "bazel test --config=ci //...  --build_metadata=COMMIT_SHA=$(git rev-parse HEAD)"
