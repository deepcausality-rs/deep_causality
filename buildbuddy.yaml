# BB Workflows configuration
# https://www.buildbuddy.io/docs/workflows-config
actions:
  - name: "BazelCI"
    container_image: "ubuntu-24.04"
    triggers:
      pull_request:
        branches:
          - "main"
    steps:
      # Build all targets
      - run: "bazel build --config=ci //... --build_metadata=COMMIT_SHA=$(git rev-parse HEAD)"
      # Run all tests
      - run: "bazel test --config=ci //...  --build_metadata=COMMIT_SHA=$(git rev-parse HEAD)"
