# BB Workflows configuration
# https://www.buildbuddy.io/docs/workflows-config
actions:
  - name: "BazelCI"
    container_image: "ubuntu-24.04"
    triggers:
      pull_request:
        branches:
          - "main"
    # UNITS: `GB` HERE MEANS GiB, NOT 10^9.
    resource_requests:
      memory: "8GB" # 8 is default
      disk: "20GB"  # 20 is default
    steps:
      # Build all targets
      - run: "bazel build --config=ci -- //... -//lean/..."
      # Run all tests
      - run: "bazel test --config=ci -- //... -//lean/..."
