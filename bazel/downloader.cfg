# Bazel downloader rewrites.
#
# rules_rs pins an exact zlib .deb by URL and sha256 in
# `rs/private/rustc_repository.bzl` (`_LINUX_ZLIB`), because upstream Linux rustc
# bundles a libLLVM that dynamically links libz.so.1. The pinned version is
# `1.3.dfsg-3.1ubuntu2.1`.
#
# Ubuntu's pool/main only carries the CURRENT version of a package. When
# `1.3.dfsg-3.1ubuntu2.2` landed as a security update, the pinned file was deleted
# from both archive.ubuntu.com and ports.ubuntu.com, and every Linux fetch started
# failing:
#
#   Error downloading [https://archive.ubuntu.com/ubuntu/pool/main/z/zlib/
#   zlib1g_1.3.dfsg-3.1ubuntu2.1_amd64.deb]: GET returned 404 Not Found
#
# This is invisible on macOS, since `_add_linux_zlib` returns early for non-Linux
# exec triples. It only breaks Linux builds, which is to say CI.
#
# snapshot.ubuntu.com is Ubuntu's immutable archive and still serves the exact
# pinned files, byte-identical: both sha256 values in `_LINUX_ZLIB` verify against
# it, so nothing about the pin is being weakened here. Note the amd64 and arm64
# rewrites both target the `ubuntu` tree; snapshot has no `ubuntu-ports` path
# (it answers 401), but its `ubuntu` tree carries the arm64 .deb.
#
# Remove this once rules_rs pins a URL that does not rot. Tracked upstream at
# https://github.com/hermeticbuild/rules_rs (no issue filed as of 2026-09-02).

rewrite archive\.ubuntu\.com/ubuntu/(.*) snapshot.ubuntu.com/ubuntu/20250601T000000Z/$1
rewrite ports\.ubuntu\.com/ubuntu-ports/(.*) snapshot.ubuntu.com/ubuntu/20250601T000000Z/$1
