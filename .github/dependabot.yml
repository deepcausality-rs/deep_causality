# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

# To receive Dependabot updates when a new version of a GitHub Action (including release-plz) is available
# https://release-plz.ieni.dev/docs/github/update

# Cargo and npm version updates come from .github/workflows/deps_update.yml, which runs
# scripts/update.sh. Dependabot security updates are a repository setting and stay on.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Check for updates weekly on Monday
    schedule:
      interval: "weekly"
