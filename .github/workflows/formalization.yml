# Formalization CI — the L1 (Lean) gate and the Lean<->Rust traceability check.
# See lean/README.md and openspec/notes/causal-algebra/Formalization.md.
#
# Both gates run on every PR/push (fast). Kani (L3, bounded model checking) is NOT run in CI:
# a full run took ~2h and the project cannot foot that CI bill. The Kani harnesses in
# deep_causality_core/tests/kani_proofs.rs remain and can be run locally on demand
# (`cargo kani --tests -p deep_causality_core`).

name: LEAN Formalization

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The mathematical truth. A broken law fails `lake build`.
  lean:
    name: lean (lake build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v7
      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lake exe cache get
        run: lake exe cache get || true
      - name: lake build
        run: lake build

  # No unproven placeholders. Our proof files must be zero-sorry; the only whitelisted slots are the
  # QCM obligation stubs under DeepCausalityFormal/Quantum/ (which land with deep_causality_quantum).
  # The guard is scoped to our own proofs — never the vendored Mathlib under lean/.lake/.
  sorry-guard:
    name: no sorry outside Quantum obligations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail if a bare sorry appears outside the whitelisted Quantum/ obligation slots
        run: |
          set -euo pipefail
          # Word-boundaried, lowercase `sorry` token: `sorryAx` / `isSyntheticSorry` do NOT match.
          # Whitelist: DeepCausalityFormal/Quantum/ (deferred QCM obligations). Proof prose must not
          # use the bare token — write "unproven placeholder" instead — or the guard trips.
          hits=$(grep -rnw 'sorry' lean/DeepCausalityFormal --include='*.lean' \
                 | grep -v '/Quantum/' || true)
          if [ -n "$hits" ]; then
            echo "Found a bare sorry outside the whitelisted Quantum/ obligation slots:"
            echo "$hits"
            exit 1
          fi
          echo "OK: zero sorry outside the Quantum/ obligation slots."

  # The bridge — every THEOREM_MAP id must appear in both a Lean file and a Rust file.
  theorem-map:
    name: theorem-map consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every proved Lean theorem needs a Rust witness and a manifest entry
        shell: bash
        run: |
          set -euo pipefail
          # The crate list comes from the workspace manifest via crates.sh rather than being
          # written out here. A hand-maintained list was a trap in two directions: a new crate
          # carrying a witness was invisible until someone remembered to add it, and a crate that
          # moved on disk turned every id into a false "MISSING Rust witness" because `grep`
          # printed "No such file or directory" while `|| true` swallowed the exit status.
          source scripts/crates.sh
          echo "Searching ${#DC_CRATE_DIRS[@]} crate directories for witnesses."

          # Source of truth: the `THEOREM_MAP: `id`` tags in the Lean proofs.
          ids=$(grep -rhoE 'THEOREM_MAP: `[a-z0-9_.]+`' lean --include='*.lean' \
                | sed -E 's/.*`([a-z0-9_.]+)`.*/\1/' | sort -u || true)
          if [ -z "$ids" ]; then echo "no THEOREM_MAP ids found in lean/**/*.lean"; exit 1; fi
          fail=0
          for id in $ids; do
            rust_hit=$(grep -Frl "THEOREM_MAP: $id" "${DC_CRATE_DIRS[@]}" --include='*.rs' || true)
            map_hit=$(grep -Fl "$id" lean/THEOREM_MAP.md || true)
            if [ -z "$rust_hit" ]; then echo "MISSING Rust witness for id: $id"; fail=1; fi
            if [ -z "$map_hit" ]; then echo "MISSING THEOREM_MAP.md entry for id: $id"; fail=1; fi
          done
          exit $fail

      - name: Every path cited by a Lean proof or by THEOREM_MAP.md resolves
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_TEMP_LEAN_SRC="$(mktemp)"; RUNNER_TEMP_FN_NAMES="$(mktemp)"
          trap 'rm -f "$RUNNER_TEMP_LEAN_SRC" "$RUNNER_TEMP_FN_NAMES"' EXIT
          # Nothing used to check these. Five witness references rotted through the July num split,
          # a quantum test reorganisation and a mirror file that never existed, and stayed broken
          # for weeks: the job above greps THEOREM_MAP.md for the theorem *id* and never for the
          # path beside it.
          #
          # `git ls-files` rather than `grep -r`: lean/.lake holds vendored Mathlib and Batteries,
          # which cite thousands of paths that are none of this repo's business.
          git ls-files 'lean/*.lean' > "$RUNNER_TEMP_LEAN_SRC"
          fail=0; checked=0
          # Cited paths are backtick-quoted. Anchoring on the backtick keeps a relative path like
          # `tests/formalization_lean/x.rs` from being read as the repo path `lean/x.rs`.
          paths=$( { xargs grep -ohE '`(deep_causality|ultragraph|lean)[A-Za-z0-9_/.-]*\.(rs|lean)`' \
                       < "$RUNNER_TEMP_LEAN_SRC"
                     grep -ohE '`(deep_causality|ultragraph|lean)[A-Za-z0-9_/.-]*\.(rs|lean)`' \
                       lean/THEOREM_MAP.md; } | tr -d '`' | sort -u )
          for p in $paths; do
            # Prose elides a long path as `crate/.../file.rs`. That is a legitimate reading aid
            # rather than a citation, and there is nothing to resolve, so skip it.
            case "$p" in */.../*) continue ;; esac
            checked=$((checked+1))
            if [ ! -f "$p" ]; then echo "MISSING file cited by the formalization: $p"; fail=1; fi
          done
          echo "checked $checked cited paths"

          # A named Rust test that no longer exists is the same defect one level down. Collect every
          # test name in the repo once rather than grepping the tree per candidate.
          git ls-files '*.rs' | xargs grep -ohE '\bfn (test_[a-z0-9_]+|[a-z0-9_]*_tests?)\b' \
            | sed -E 's/^fn //' | sort -u > "$RUNNER_TEMP_FN_NAMES"
          for fn in $(xargs grep -ohE '`test_[a-z0-9_]+`' < "$RUNNER_TEMP_LEAN_SRC" \
                        | tr -d '`' | sort -u); do
            if ! grep -qxF "$fn" "$RUNNER_TEMP_FN_NAMES"; then
              echo "MISSING Rust test named by a Lean proof: $fn"; fail=1
            fi
          done
          exit $fail
