# Answers: does every crate build without the standard library, or is it std-only by decision?
#
# The target is a 32-bit Cortex-M4F with no `std`, so a dependency that pulls in `std` fails the
# build instead of linking it. The no_std and alloc jobs walk every workspace crate; the std-only
# crates and the reason for each are listed in `scripts/bare_metal.sh`.

name: no_std

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  no-std:
    name: no_std build (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          target: thumbv7em-none-eabihf
      - run: bash scripts/check_no_std.sh thumbv7em-none-eabihf

  # `alloc` is a level without a float-math backend. Each alloc-only build must either build or
  # stop at the deep_causality_num guard, with no other crate failing.
  alloc:
    name: alloc-only build (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          target: thumbv7em-none-eabihf
      - run: bash scripts/check_alloc.sh thumbv7em-none-eabihf

  # A crate whose `no-std` feature does not name `alloc` must link into an application with no
  # `#[global_allocator]`. rustc checks that only when it links a final artifact, so the other two
  # jobs, which build rlibs, cannot see it.
  core:
    name: core-only link (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          target: thumbv7em-none-eabihf
      - run: bash scripts/check_core.sh thumbv7em-none-eabihf
