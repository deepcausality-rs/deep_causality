name: Unused Deps

on: [ pull_request ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  unused_dependencies:
    name: cargo machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - name: cargo machete over every workspace crate
        shell: bash
        run: |
          set -euo pipefail
          # The crate list comes from the workspace manifest via crates.sh 
          source scripts/crates.sh
          echo "Checking ${#DC_CRATE_DIRS[@]} crates for unused dependencies."
          cargo machete "${DC_CRATE_DIRS[@]}"
