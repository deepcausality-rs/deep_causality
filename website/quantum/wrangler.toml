# Cloudflare Workers + Static Assets config for the DeepCausality Quantum site.
#
# Fully static — no SSR, no API routes, no `main` worker entry. Wrangler
# uploads dist/ as the Worker's static assets. Mirrors website/cfd/wrangler.toml.

# The Worker name is what `wrangler deploy` acts on; it must match the Worker
# the Cloudflare build is attached to, which is the one holding the
# quantum.deepcausality.com binding. A mismatch does not fail: wrangler creates
# a second Worker with no domain bound and reports success while the live site
# stays unchanged. Note that the sibling sites do not share one spelling
# (`deepcausality-prod`, `deepcausality-docs`, `deep-causality-cfd-prod`), so
# match the dashboard rather than the pattern.
name = "quantum"
# Same account as the other three sites; pinned explicitly because this
# credential is linked to two Cloudflare accounts.
account_id = "222139bff18ce0390d15f59a78d3d6b2"
compatibility_date = "2026-05-01"

# Build here, not in the Cloudflare dashboard's "Build command" field. Wrangler
# runs this custom build before it reads `assets.directory`, so `dist/` exists
# by the time the deploy needs it. Left to the dashboard, an empty field does
# not fail the build step at all: Cloudflare installs dependencies, skips
# straight to `npx wrangler deploy`, and the deploy dies on
# `The directory specified by the "assets.directory" field ... does not exist`.
[build]
command = "pnpm run build"

[assets]
directory = "./dist"
not_found_handling = "404-page"

[observability]
enabled = true
