# Cloudflare Workers + Static Assets config for the DeepCausality Quantum site.
#
# Fully static Wrangler uploads dist/ as the Worker's static assets.
# Mirrors website/cfd/wrangler.toml.

# The Worker name is what `wrangler deploy` acts on; it must match the Worker
# the Cloudflare build is attached to, which is the one holding the
# quantum.deepcausality.com binding.
name = "quantum"
account_id = "222139bff18ce0390d15f59a78d3d6b2"
compatibility_date = "2026-05-01"
[build]
command = "pnpm run build"

[assets]
directory = "./dist"
not_found_handling = "404-page"

[observability]
enabled = true
