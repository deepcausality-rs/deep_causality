# Cloudflare Workers + Static Assets config for the DeepCausality CFD site.
#
# Fully static Wrangler uploads dist/ as the Worker's static assets.
# Mirrors website/web/wrangler.toml.

# Hyphenated "deep-causality". This must match the Worker the Cloudflare build is attached to, which is the one
# holding the cfd.deepcausality.com binding, so do not "fix" the spelling for
# consistency with the other two sites.
name = "deep-causality-cfd-prod"
account_id = "222139bff18ce0390d15f59a78d3d6b2"
compatibility_date = "2026-05-01"
[build]
command = "pnpm run build"

[assets]
directory = "./dist"
not_found_handling = "404-page"

[observability]
enabled = true
