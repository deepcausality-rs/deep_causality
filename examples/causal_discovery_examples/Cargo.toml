[package]
name = "causal_discovery_examples"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "no_lib.rs"


[dependencies]
deep_causality_algorithms = { workspace = true }
deep_causality_core = { workspace = true, features = ["default"] }
deep_causality_haft = { workspace = true, features = ["default"] }
deep_causality_discovery = { workspace = true }
deep_causality_num = { workspace = true, features = ["default"] }
deep_causality_tensor = { workspace = true, features = ["default"] }
# Example-only ML dependency (the `example_ml_rca` Candle integration).
# CPU-only, default features.
candle-core = { workspace = true }

[[example]]
name = "example_mrmr"
path = "algos/mrmr/main.rs"

[[example]]
name = "example_mrmr_cdl"
path = "algos/mrmr_cdl/main.rs"

[[example]]
name = "example_surd"
path = "algos/surd/main.rs"

[[example]]
name = "example_surd_discovery"
path = "cdl/surd_discovery/main.rs"

[[example]]
name = "example_brcd_discovery"
path = "cdl/brcd_discovery/main.rs"

[[example]]
name = "example_brcd_boss_discovery"
path = "cdl/brcd_boss_discovery/main.rs"

[[example]]
name = "example_ml_rca"
path = "ml/ml_rca/main.rs"

[lints]
workspace = true
