[package]
name = "quantum_examples"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "no_lib.rs"

[dependencies]
deep_causality = { workspace = true }
deep_causality_core = { workspace = true, features = ["default"] }
deep_causality_calculus = { workspace = true, features = ["default"] }
deep_causality_multivector = { workspace = true, features = ["default"] }
deep_causality_num = { workspace = true, features = ["default"] }
deep_causality_num_complex = { workspace = true, features = ["default"] }
deep_causality_algebra = { workspace = true, features = ["default"] }
deep_causality_physics = { workspace = true, features = ["default"] }
deep_causality_quantum = { workspace = true }
deep_causality_tensor = { workspace = true, features = ["default"] }

