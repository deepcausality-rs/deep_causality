deep_causality_algebra = { workspace = true, features = ["default"] }
deep_causality_rand = { workspace = true }
deep_causality_stats = { workspace = true, features = ["default"] }
deep_causality_linear = { workspace = true, features = ["default"] }
deep_causality_tensor = { workspace = true, features = ["default"] }
deep_causality_topology = { workspace = true }

