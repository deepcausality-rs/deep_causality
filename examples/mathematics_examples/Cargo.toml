[package]
name = "mathematics_examples"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "no_lib.rs"

[dependencies]
deep_causality_core = { workspace = true, features = ["default"] }
deep_causality_calculus = { workspace = true, features = ["default"] }
deep_causality_fft = { workspace = true, features = ["default"] }
deep_causality_haft = { workspace = true, features = ["default"] }
