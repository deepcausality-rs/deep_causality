[workspace]
resolver = "2"
members = [
    "deep_causality",
    "deep_causality_algorithms",
    "deep_causality_cfd",
    "deep_causality_core",
    "deep_causality_data_structures",
    "deep_causality_discovery",
    "deep_causality_ethos",
    "deep_causality_file",
    "deep_causality_par",
    "deep_causality_physics",
    "deep_causality_quantum",
    "ultragraph",
    # Unified math: All the mathematics crates
    "deep_causality_unified_math/*",
    # All code examples
    "examples/*",
]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[workspace.dependencies]
# Empty

# Repo-wide lint policy.
# Member crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
# `cfg(kani)` is set only by the Kani driver (`cargo kani`); register it so the
# `#![cfg(kani)]`-gated proof harnesses do not trip the `unexpected_cfgs` lint.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

# Optimize all crates
[profile.release]
opt-level = 3
strip = true  # Automatically strip debug symbols from the binary
lto = true    # Enable Link Time Optimization (LTO)
codegen-units = 1 # Reduce Parallel Code Generation Units to Increase Optimization

# There's a Cargo feature named profile-overrides
# that lets you override the optimization level of dependencies.
# https://docs.rust-embedded.org/book/unsorted/speed-vs-size.html
[profile.release.package."*"]
opt-level = 3
strip = true  # Automatically strip debug symbols from the binary to reduce size
codegen-units = 1 # Reduce Parallel Code Generation Units to Increase Optimization
