[package]
name = "deep_causality_context"
version = "0.2.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }

readme = "README.md"
description = "Context hypergraph, context node types, and contextuable traits for DeepCausality."
documentation = "https://docs.rs/deep_causality_context"
keywords = ["causality", "context", "hypergraph", "spacetime"]
authors = ["Marvin Hansen <marvin.hansen@gmail.com>"]
categories = [
    "data-structures",
    "science",
    "aerospace",
    "mathematics",
]
exclude = [
    "*.bazel",
    "*/*.bazel",
    "*.bazel.*",
    "BUILD",
    "BUILD.bazel",
    "MODULE.bazel",
    ".bazelignore",
    ".bazelrc",
    "papers/*",
]

[features]
default = ["std"]
std = [
    "alloc",
    "deep_causality_algebra/std",
    "deep_causality_context_store/std",
    "deep_causality_core/std",
    "deep_causality_data_structures/std",
    "deep_causality_metric/std",
    "deep_causality_num/std",
    "deep_causality_uncertain/std",
    "ultragraph/std",
]
alloc = [
    "deep_causality_context_store/alloc",
    "deep_causality_core/alloc",
    "deep_causality_data_structures/alloc",
    "deep_causality_metric/alloc",
    "deep_causality_uncertain/alloc",
    "ultragraph/alloc",
]
no-std = [
    "alloc",
    "deep_causality_algebra/no-std",
    "deep_causality_context_store/no-std",
    "deep_causality_core/no-std",
    "deep_causality_data_structures/no-std",
    "deep_causality_metric/no-std",
    "deep_causality_num/no-std",
    "deep_causality_uncertain/no-std",
    "ultragraph/no-std",
]
# Enables random number generator from the host OS for secure random numbers.
# Enabling os-random adds an indirect dependency on getrandom and libc.
# Disabled by default to use native Rust rng instead.
os-random = ["deep_causality_uncertain/os-random"]

[dependencies.deep_causality_algebra]
workspace = true

[dependencies.deep_causality_context_store]
workspace = true

[dependencies.deep_causality_core]
workspace = true

[dependencies.deep_causality_data_structures]
workspace = true

[dependencies.deep_causality_num]
workspace = true

[dependencies.deep_causality_metric]
workspace = true

[dependencies.deep_causality_uncertain]
workspace = true

[dependencies.ultragraph]
workspace = true

[lints]
workspace = true
