[package]
name = "deep_causality_context"
version = "0.1.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }

readme = "README.md"
description = "Context hypergraph, context node types, and contextuable traits for DeepCausality."
documentation = "https://docs.rs/deep_causality_context"
keywords = ["causality", "context", "hypergraph", "spacetime"]
authors = ["Marvin Hansen <marvin.hansen@gmail.com>"]
categories = [
    "data-structures",
    "science",
    "aerospace",
    "mathematics",
]
exclude = [
    "*.bazel",
    "*/*.bazel",
    "*.bazel.*",
    "BUILD",
    "BUILD.bazel",
    "MODULE.bazel",
    ".bazelignore",
    ".bazelrc",
    "tests/**/*",
    "papers/*",
]

[features]
# Enables random number generator from the host OS for secure random numbers.
# Enabling os-random adds an indirect dependency on getrandom and libc.
# Disabled by default to use native Rust rng instead.
os-random = ["deep_causality_uncertain/os-random"]

[dependencies.deep_causality_algebra]
workspace = true
features = ["default"]

[dependencies.deep_causality_core]
workspace = true
features = ["default"]

[dependencies.deep_causality_data_structures]
workspace = true

[dependencies.deep_causality_num]
workspace = true
features = ["default"]

[dependencies.deep_causality_metric]
workspace = true
features = ["default"]

[dependencies.deep_causality_uncertain]
workspace = true

[dependencies.ultragraph]
workspace = true

[lints]
workspace = true
