[package]
name = "ultragraph"
version = "0.10.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }

repository = "https://github.com/deepcausality/deep_causality.rs"
authors = ["Marvin Hansen <marvin.hansen@gmail.com>", ]
description = "Hypergraph data structure."
documentation = "https://docs.rs/ultragraph"
homepage = "https://github.com/deepcausality/deep_causality/tree/main/ultragraph"
categories = ["data-structures"]
keywords = ["data-structures"]
exclude = [
    "*.bazel",
    "*/*.bazel",
    "*.bazel.*",
    "BUILD",
    "BUILD.bazel",
    "MODULE.bazel",
    ".bazelignore",
    ".bazelrc",
    "tests/**/*",
    "papers/*",
]

[features]
default = ["std"]
std = ["alloc"]
alloc = []
no-std = ["alloc"]

[dev-dependencies]
criterion = { workspace = true }
deep_causality_rand = { workspace = true }

[[bench]]
name = "bench_main"
harness = false

[[example]]
name = "ultragraph_example"
path = "examples/ultraph_example.rs"

[lints]
workspace = true
