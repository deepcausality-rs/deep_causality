[package]
name = "deep_causality_sparse"
version = "0.2.5"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }

repository = "https://github.com/deepcausality/deep_causality.rs"
authors = ["Marvin Hansen <marvin.hansen@gmail.com>"]
description = "Spare matrix data structure for for deep_causality crate."
documentation = "https://docs.rs/deep_causality"
categories = ["data-structures", "science"]
keywords = ["data-structures", "sparse-matrix", "csr"]
exclude = [
    "*.bazel",
    "*/*.bazel",
    "*.bazel.*",
    "BUILD",
    "BUILD.bazel",
    "MODULE.bazel",
    ".bazelignore",
    ".bazelrc",
    "tests/**/*",
    "papers/*",
]

[features]
default = ["std"]
std = ["alloc", "deep_causality_linear/std"]
alloc = []
no-std = ["alloc", "deep_causality_linear/no-std"]

[lints]
workspace = true

[dependencies.deep_causality_linear]
path = "../deep_causality_linear"
version = "0.1"
default-features = false
